[package]
name = "loop-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = {"version" = "4.6.1", "features" = ["derive"]}
lib = { path = "../lib", features = ["server", "database", "db-sqlite", "db-postgres"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.52", features = ["rt-multi-thread"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
