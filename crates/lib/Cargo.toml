[package]
name = "lib"
version = "0.1.0"
edition = "2024"

[features]
default = ["server", "database", "macros", "db-sqlite"]
# engine: registers endpoints and manages how they execute (validation +
# native dispatch). server: shared HTTP/SSE/WebSocket serving layer on top of
# the engine, and now also owns the endpoint module itself (Endpoint, Schema
# conversion errors, etc.) since endpoints are a server concern. Consumers who
# only need bare Schema definitions without endpoints can still stay
# dependency-light by disabling default features and skipping "server".
engine = ["dep:tokio"]
server = ["engine", "dep:axum", "dep:serde_json", "dep:tokio-stream", "dep:base64"]
# macros: the #[rest]/#[sse]/#[live] attributes + automatic registration
macros = ["dep:loop-macros", "dep:inventory"]
# database: sqlx-backed storage with schema-guided queries and migrations.
# Enable at least one driver (db-sqlite / db-postgres).
database = ["engine", "dep:sqlx"]
db-sqlite = ["database", "sqlx/sqlite"]
db-postgres = ["database", "sqlx/postgres"]
# eth: alloy-backed ethereum client with schema-typed chain primitives.
# Needs "server" because FromValue/IntoHandlerOutput live in the endpoint
# layer; alloy stays hidden behind loop's own types.
eth = ["server", "dep:alloy"]
# auth: privy-inspired identity — email/password, email one-time codes,
# sessions as bearer tokens, and (with "eth") SIWE wallet login plus an
# embedded wallet manager. Mounts /auth/* routes when configured.
auth = [
    "server",
    "database",
    "dep:argon2",
    "dep:sha2",
    "dep:rand",
    "dep:chacha20poly1305",
    "dep:hkdf",
]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
regex-lite = "0.1"
http = "1.4.2"
http-serde = "2.1.1"
bson = { version = "3.1.0", features = ["serde"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
axum = { version = "0.8.9", features = ["ws"], optional = true }
serde_json = { version = "1", optional = true }
tokio-stream = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
loop-macros = { path = "../macros", optional = true }
inventory = { version = "0.3", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"], optional = true }
argon2 = { version = "0.5", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.9", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
# pinned exact: the meta-crate's feature names shift between releases
alloy = { version = "=2.1.1", default-features = false, features = [
    "std",
    "providers",
    "provider-http",
    "reqwest-rustls-tls",
    "rpc-types",
    "signer-local",
    "network",
    "consensus",
    "dyn-abi",
    "k256",
], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
