<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>circle game</title>
    <style>
      body { font-family: monospace; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; background: #111; color: #eee; }
      canvas { background: #1d1d1d; border: 1px solid #444; }
    </style>
  </head>
  <body>
    <div>player 1: WASD &nbsp;|&nbsp; player 2: arrow keys</div>
    <canvas id="board" width="400" height="400"></canvas>
    <div id="status">connecting…</div>
    <script>
      const SERVER = "127.0.0.1:3000";
      const STEP = 12;
      const RADIUS = 14;
      const ctx = document.getElementById("board").getContext("2d");
      const status = document.getElementById("status");

      let state = { p1: [80, 80], p2: [320, 320] };

      function circle(position, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(position[0], position[1], RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, 400, 400);
        circle(state.p1, "#4fc3f7");
        circle(state.p2, "#ff8a65");
      }

      const socket = new WebSocket(`ws://${SERVER}/watch`);
      socket.onopen = () => (status.textContent = "connected");
      socket.onclose = () => (status.textContent = "disconnected");
      socket.onmessage = (event) => {
        state = JSON.parse(event.data);
        draw();
      };

      function move(player, dx, dy) {
        fetch(`http://${SERVER}/move/${player}?dx=${dx}&dy=${dy}`, { mode: "no-cors" });
      }

      const keys = {
        w: [1, 0, -STEP], s: [1, 0, STEP], a: [1, -STEP, 0], d: [1, STEP, 0],
        ArrowUp: [2, 0, -STEP], ArrowDown: [2, 0, STEP],
        ArrowLeft: [2, -STEP, 0], ArrowRight: [2, STEP, 0],
      };

      document.addEventListener("keydown", (event) => {
        const binding = keys[event.key];
        if (binding) {
          event.preventDefault();
          move(...binding);
        }
      });

      draw();
    </script>
  </body>
</html>
