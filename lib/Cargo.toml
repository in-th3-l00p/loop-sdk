[package]
name = "lib"
version = "0.1.0"
edition = "2024"

[features]
# engine: registers endpoints and manages how they execute (validation +
# native dispatch). server: shared HTTP/SSE/WebSocket serving layer on top of
# the engine. Both kept out of the default build so consumers who only need
# Schema/Endpoint definitions stay dependency-light.
engine = ["dep:tokio"]
server = ["engine", "dep:axum", "dep:serde_json", "dep:tokio-stream", "dep:base64"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
http = "1.4.2"
http-serde = "2.1.1"
bson = { version = "3.1.0", features = ["serde"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
axum = { version = "0.8.9", features = ["ws"], optional = true }
serde_json = { version = "1", optional = true }
tokio-stream = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
