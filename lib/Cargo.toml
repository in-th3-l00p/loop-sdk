[package]
name = "lib"
version = "0.1.0"
edition = "2024"

[features]
# Executes endpoint definitions (Access dispatch, Binding::Wasm, etc). Kept
# separate from the default build so consumers who only need Schema/Endpoint
# definitions aren't forced to pull in the runtime's dependencies.
engine = ["dep:tokio", "dep:axum", "dep:serde_json", "dep:wasmtime", "dep:wasmtime-wasi", "dep:toml", "dep:tokio-stream", "dep:base64"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
http = "1.4.2"
http-serde = "2.1.1"
bson = { version = "3.1.0", features = ["serde"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
axum = { version = "0.8.9", features = ["ws"], optional = true }
serde_json = { version = "1", optional = true }
tokio-stream = { version = "0.1", optional = true }
toml = { version = "0.9", optional = true }
base64 = { version = "0.22", optional = true }
wasmtime = { version = "46", optional = true, default-features = false, features = ["cranelift", "runtime", "wat", "std"] }
wasmtime-wasi = { version = "46", optional = true, default-features = false, features = ["p1"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = "0.28"
tempfile = "3"
futures-util = "0.3"

[[bin]]
name = "loop-server"
path = "src/bin/server.rs"
required-features = ["engine"]
